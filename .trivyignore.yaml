# Accepted risks for the pinned Uptime Kuma image, reviewed 2026-11-10.
# 2.5.9 is the newest release; these components are bundled by the image and have no fix there yet.
# Each entry expires: after that date the CI fails again and the finding has to be reviewed anew.
# Remove an entry as soon as an image update ships the fix (Dependabot pull request).
vulnerabilities:
  - id: CVE-2026-111497
    statement: >-
      libbrotli1 (Debian base). Kuma only decodes responses of the monitored sites, which are our own;
      no untrusted input reaches the decoder.
    expired_at: 2026-12-10
  - id: CVE-2026-41242
    statement: >-
      protobufjs (npm). Only used by gRPC monitors whose proto definition the admin enters; the dashboard
      is reachable only through an SSH tunnel and no gRPC monitors are configured.
    expired_at: 2026-12-10
  - id: CVE-2026-59873
    statement: >-
      tar (npm), denial of service via crafted gzip archives. Kuma does not extract archives from
      untrusted sources at runtime.
    expired_at: 2026-12-10
  - id: CVE-2024-24790
    statement: >-
      Go 1.20.5 stdlib in extra/healthcheck. The binary only requests http://localhost:3001 inside the
      container; no external input.
    expired_at: 2026-12-10
  - id: CVE-2025-68121
    statement: >-
      Go 1.20.5 stdlib in extra/healthcheck, TLS session resumption. The healthcheck uses plain HTTP on
      localhost, no TLS session is resumed.
    expired_at: 2026-12-10
